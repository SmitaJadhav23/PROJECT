<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Health Inquiry Form</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" integrity="sha512-Fo3rlrZj/k7ujTnHg4CGR2D7kSs0v4LLanw2qksYuRlEzO+tcaEPQogQ0KaoGN26/zrn20ImR1DfuLWnOo7aBA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Navigation Bar -->
    <header>
        <nav>
            <div class="logo">
                <p>Perfect Pulse System</p>
            </div>
            <ul>
                <li><a href="index.html"><i class="fas fa-search"></i></a></li>
                <li><a href="index.html">Home</a></li>
                <li><a href="About.html">About</a></li>
                <li><a href="newarrival.html">Schedules</a></li>
                <li><a href="contact.html">Contact</a></li>
                <li><a href="dietplans.html">Diet Plans</a></li>
            </ul>
        </nav>
    </header> 

    <!-- Background Image -->
    <div class="background"></div>
    
    <!-- Health Inquiry Form Container -->
    <div class="form-container" id="healthInquiryForm">
        <h3>Health Inquiry Form</h3>

        <form id="healthForm" onsubmit="return handleHealthFormSubmission()">
            <div class="form-group">
                <label for="weight">Weight (kg)</label>
                <input type="number" id="weight" name="weight" placeholder="Enter your weight" required>
            </div>

            <div class="form-group">
                <label for="height">Height (cm)</label>
                <input type="number" id="height" name="height" placeholder="Enter your height" required>
            </div>

            <div class="form-group">
                <label for="age">Age</label>
                <input type="number" id="age" name="age" placeholder="Enter your age" required>
            </div>

            <div class="form-group">
                <label for="disease">Pre-existing Conditions or Diseases</label>
                <input type="text" id="disease" name="disease" placeholder="E.g., Diabetes, Hypertension, None" required>
            </div>

            <div class="form-group">
                <label for="additionalInfo">Additional Information</label>
                <input type="text" id="additionalInfo" name="additionalInfo" placeholder="Any other relevant information">
            </div>

            <div class="form-group">
                <input type="submit" value="Submit Inquiry">
            </div>
        </form>

        <a href="index.html" class="back-btn"><i class="fa fa-arrow-left"></i> Back to Home</a>
    </div>

    <!-- Confirmation Message -->
    <div class="confirmation-message" id="healthConfirmationMessage">
        <p>Your health details have been submitted! We will match you with a suitable gym trainer soon.</p>
    </div>

    <!-- JavaScript for Form Validation -->
    <script>
        // Handle Health Form Submission
        function handleHealthFormSubmission() {
            var weight = document.getElementById("weight").value;
            var height = document.getElementById("height").value;
            var age = document.getElementById("age").value;
            var disease = document.getElementById("disease").value;

            if (weight == "" || height == "" || age == "" || disease == "") {
                alert("Please fill in all fields.");
                return false;
            }

            if (age < 18) {
                alert("You must be at least 18 years old to use this service.");
                return false;
            }

            document.getElementById('healthInquiryForm').style.display = 'none';
            document.getElementById('healthConfirmationMessage').style.display = 'block';

            return false; // Prevent actual form submission for demo
        }
    </script>
</body>
</html>
